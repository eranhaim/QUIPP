services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: quipp_backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      NODE_ENV: production
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - quipp

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: quipp_web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8089:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quipp

networks:
  quipp:
    driver: bridge
